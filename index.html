<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>صوتی مترجم</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      background: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .header-box {
      text-align: center;
      margin-top: 20px;
    }
    .status-text {
      font-size: 26px;
      font-weight: 800;
      color: #1e293b;
      min-height: 40px;
      transition: color 0.2s;
    }
    .center-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 40px 0;
    }
    .mic-button {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: 8px solid #fee2e2;
      outline: none;
      cursor: pointer;
      box-shadow: 0 16px 36px rgba(220, 38, 38, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
    }
    .mic-button:active {
      transform: scale(0.92);
    }
    .mic-button.listening {
      background: linear-gradient(135deg, #b91c1c, #991b1b);
      border-color: #fca5a5;
      animation: pulse-ring 1.2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }
    .mic-icon {
      width: 75px;
      height: 75px;
      fill: #ffffff;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
      70% { box-shadow: 0 0 0 35px rgba(220, 38, 38, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }
    .result-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 18px;
      padding: 20px 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
      display: none;
      border: 1px solid #e2e8f0;
      text-align: right;
    }
    .result-row {
      margin-bottom: 12px;
      font-size: 20px;
      color: #334155;
      line-height: 1.5;
    }
    .result-row:last-child {
      margin-bottom: 0;
    }
    .tag {
      display: inline-block;
      font-size: 13px;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 6px;
      margin-left: 8px;
      color: #fff;
    }
    .tag-en { background-color: #2563eb; }
    .tag-ar { background-color: #059669; }
  </style>
</head>
<body>

  <div class="header-box">
    <div class="status-text" id="statusLabel">مائیک کا بٹن دبائیں اور بولیں</div>
  </div>

  <div class="center-container">
    <button class="mic-button" id="micBtn" onclick="handleMicToggle()">
      <svg class="mic-icon" viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
      </svg>
    </button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-row" id="rowOriginal"></div>
    <div class="result-row" id="rowEnglish"></div>
    <div class="result-row" id="rowArabic"></div>
  </div>

  <script>
    let recognition = null;
    let isListening = false;
    let currentAudio = null;

    const micBtn = document.getElementById('micBtn');
    const statusLabel = document.getElementById('statusLabel');
    const resultCard = document.getElementById('resultCard');
    const rowOriginal = document.getElementById('rowOriginal');
    const rowEnglish = document.getElementById('rowEnglish');
    const rowArabic = document.getElementById('rowArabic');

    // اینڈرائڈ اور کروم اسپیچ سیٹ اپ
    function setupRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        statusLabel.innerText = "براؤزر میں مائیک کی سہولت موجود نہیں۔";
        return null;
      }
      const rec = new SpeechRecognition();
      rec.lang = 'ur-PK';
      rec.continuous = false;
      rec.interimResults = false;

      rec.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        statusLabel.innerText = "سن رہا ہے... بولئے";
        statusLabel.style.color = "#dc2626";
      };

      rec.onresult = (event) => {
        isListening = false;
        micBtn.classList.remove('listening');
        const text = event.results[0][0].transcript;
        statusLabel.innerText = "سنیں:";
        statusLabel.style.color = "#2563eb";
        displayOriginalText(text);
        startExecutionPipeline(text);
      };

      rec.onerror = (e) => {
        isListening = false;
        micBtn.classList.remove('listening');
        statusLabel.innerText = "دوبارہ مائیک دبائیں";
        statusLabel.style.color = "#1e293b";
      };

      rec.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
      };

      return rec;
    }

    recognition = setupRecognition();

    function handleMicToggle() {
      stopAllAudio();
      if (!recognition) {
        recognition = setupRecognition();
      }

      if (!isListening) {
        try {
          recognition.start();
        } catch(e) {
          recognition.abort();
          setTimeout(() => { try { recognition.start(); } catch(err){} }, 100);
        }
      } else {
        // مائیک کو فوراً بند کرنا
        recognition.stop();
        isListening = false;
        micBtn.classList.remove('listening');
        statusLabel.innerText = "مائیک کا بٹن دبائیں اور بولیں";
        statusLabel.style.color = "#1e293b";
      }
    }

    function stopAllAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.src = "";
        currentAudio = null;
      }
      window.speechSynthesis.cancel();
    }

    function displayOriginalText(text) {
      resultCard.style.display = "block";
      rowOriginal.innerHTML = `<strong>آپ نے کہا:</strong> "${text}"`;
      rowEnglish.innerHTML = "";
      rowArabic.innerHTML = "";
    }

    async function startExecutionPipeline(spokenText) {
      // 1. تمہیدی آڈیو چلائیں
      const introText = "بارک اللہ ، چلیں دیکھتے ہیں اس جملے کو انگریزی اور عربی میں کیسے کہیں گے";
      speakNativeOrAudio(introText, "ur", () => {
        // 2. ترجمہ مکمل ہونے پر باقی آوازیں
        fetchTranslations(spokenText).then(res => {
          rowEnglish.innerHTML = `<span class="tag tag-en">English</span> ${res.english}`;
          rowArabic.innerHTML = `<span class="tag tag-ar">عربی</span> ${res.arabic}`;

          playSequence([
            { text: "اس جملے کو انگریزی میں اس طرح کہیں گے", lang: "ur" },
            { text: res.english, lang: "en" },
            { text: "اور اس جملے کو عربی میں اس طرح کہیں گے", lang: "ur" },
            { text: res.arabic, lang: "ar" }
          ]);
        });
      });
    }

    // پائیدار اور بامحاورہ ترجمہ
    async function fetchTranslations(urdu) {
      try {
        const [enRes, arRes] = await Promise.all([
          fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ur&tl=en&dt=t&q=${encodeURIComponent(urdu)}`),
          fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ur&tl=ar&dt=t&q=${encodeURIComponent(urdu)}`)
        ]);

        const enData = await enRes.json();
        const arData = await arRes.json();

        let en = enData[0][0][0];
        let ar = arData[0][0][0];

        // عام بول چال کے فقروں کی خودکار تصحیح
        const clean = urdu.trim();
        if (clean.includes("میرا نام") || clean.includes("میرا نا")) {
          const name = clean.replace(/میرا نام|میرا نا|ہے/g, "").trim();
          ar = `أَنَا ${name}`;
          en = `My name is ${name}`;
        }

        return { english: en, arabic: ar };
      } catch (e) {
        return { english: "Error in translation", arabic: "خطأ في الترجمة" };
      }
    }

    // موبائل پر آڈیو پلے کرنے کا سب سے پائیدار طریقہ
    function speakNativeOrAudio(text, lang, onFinish) {
      const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${lang}&client=tw-ob&q=${encodeURIComponent(text)}`;
      const audio = new Audio(audioUrl);
      currentAudio = audio;

      let finished = false;
      const done = () => {
        if (!finished) {
          finished = true;
          if (onFinish) onFinish();
        }
      };

      audio.onended = done;
      audio.onerror = () => {
        // فال بیک
        const utt = new SpeechSynthesisUtterance(text);
        utt.lang = lang === "ur" ? "ur-PK" : lang === "ar" ? "ar-SA" : "en-US";
        utt.onend = done;
        utt.onerror = done;
        window.speechSynthesis.speak(utt);
      };

      audio.play().catch(() => {
        done();
      });
    }

    function playSequence(playlist) {
      let idx = 0;
      function next() {
        if (idx < playlist.length) {
          const item = playlist[idx];
          idx++;
          speakNativeOrAudio(item.text, item.lang, next);
        } else {
          statusLabel.innerText = "مائیک کا بٹن دبائیں اور بولیں";
          statusLabel.style.color = "#1e293b";
        }
      }
      next();
    }
  </script>
</body>
</html>
