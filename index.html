<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>صوتی مترجم</title>
  
  <!-- جمیل نوری نستعلیق فانٹ -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/earlyaccess/notonastaliqurdudraft.css">
  <style>
    @font-face {
      font-family: 'Jameel Noori Nastaleeq';
      src: url('https://cdn.jsdelivr.net/gh/mshoaib/urdu-fonts/fonts/Jameel%20Noori%20Nastaleeq.ttf') format('truetype');
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      padding: 10px 14px 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      /* جدید موبائل ڈائنامک اسکرین فٹنگ */
      height: 100vh;
      height: 100dvh;
      background: #f8fafc;
      font-family: 'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu Draft', system-ui, sans-serif;
      overflow-y: auto;
    }

    .top-bar {
      width: 100%;
      max-width: 450px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex-shrink: 0;
    }

    .refresh-btn {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 15px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
      transition: all 0.2s ease;
    }
    .refresh-btn:active {
      transform: scale(0.95);
      background: #f1f5f9;
    }

    .header-box {
      text-align: center;
      margin: 4px 0;
      flex-shrink: 0;
    }

    .status-text {
      font-size: 25px;
      font-weight: 800;
      color: #1e293b;
      line-height: 1.6;
      transition: color 0.2s;
    }

    .center-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      flex-grow: 1;
      margin: 6px 0;
    }

    /* واضح اور مناسب بڑا مائیک */
    .mic-button {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: 7px solid #fee2e2;
      outline: none;
      cursor: pointer;
      box-shadow: 0 14px 32px rgba(220, 38, 38, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
    }
    .mic-button:active {
      transform: scale(0.92);
    }
    .mic-button.listening {
      background: linear-gradient(135deg, #b91c1c, #991b1b);
      border-color: #fca5a5;
      animation: pulse-ring 1.2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }
    .mic-icon {
      width: 64px;
      height: 64px;
      fill: #ffffff;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
      70% { box-shadow: 0 0 0 28px rgba(220, 38, 38, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }

    .result-card {
      width: 100%;
      max-width: 450px;
      background: #ffffff;
      border-radius: 14px;
      padding: 12px 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin: 6px 0;
      display: none;
      border: 1px solid #e2e8f0;
      text-align: right;
      flex-shrink: 0;
    }
    .result-row {
      margin-bottom: 6px;
      font-size: 18px;
      color: #334155;
      line-height: 1.6;
    }
    .tag {
      display: inline-block;
      font-size: 13px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 5px;
      margin-left: 6px;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    .tag-en { background-color: #2563eb; }
    .tag-ar { background-color: #059669; }
    
    .repeat-btn {
      width: 100%;
      margin-top: 8px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      box-shadow: 0 3px 10px rgba(2, 132, 199, 0.2);
    }
    .repeat-btn:active {
      transform: scale(0.98);
      background: #0369a1;
    }

    /* مکمل محفوظ برانڈنگ بار */
    .branding-bar {
      width: 100%;
      max-width: 450px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
      direction: ltr;
      font-family: system-ui, -apple-system, sans-serif;
      flex-shrink: 0;
      margin-bottom: 2px;
    }
    .profile-img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #2563eb;
      background: #e2e8f0;
      flex-shrink: 0;
    }
    .branding-content {
      display: flex;
      flex-direction: column;
      font-size: 12px;
      color: #475569;
      line-height: 1.35;
      text-align: left;
    }
    .branding-content strong {
      color: #0f172a;
      font-size: 13px;
    }
    .whatsapp-link {
      color: #16a34a;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 1px;
    }
  </style>
</head>
<body>

  <!-- اوپر ریفریش بٹن -->
  <div class="top-bar">
    <button class="refresh-btn" onclick="window.location.reload();">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      نیا صفحہ (ریفریش)
    </button>
  </div>

  <div class="header-box">
    <div class="status-text" id="statusLabel">مائیک کا بٹن دبائیں اور بولیں</div>
  </div>

  <div class="center-container">
    <button class="mic-button" id="micBtn" onclick="handleMicToggle()">
      <svg class="mic-icon" viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
      </svg>
    </button>
  </div>

  <!-- رزلٹ کارڈ اور ریپیٹ بٹن -->
  <div class="result-card" id="resultCard">
    <div class="result-row" id="rowOriginal"></div>
    <div class="result-row" id="rowEnglish"></div>
    <div class="result-row" id="rowArabic"></div>

    <button class="repeat-btn" id="repeatBtn" onclick="repeatCurrentAudio()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.77 20 14.44 20 13c0-4.42-3.58-8-8-8zm-6 8c0-1.01.25-1.97.7-2.8L5.24 8.74C4.46 10.23 4 11.56 4 13c0 4.42 3.58 8 8 8v4l5-5-5-5v4c-3.31 0-6-2.69-6-6z"/>
      </svg>
      دوبارہ سنیں
    </button>
  </div>

  <!-- برانڈنگ بار -->
  <div class="branding-bar">
    <img src="profile.png" alt="HassaanulHaq" class="profile-img" onerror="this.src='https://ui-avatars.com/api/?name=Hassaan+ul+Haq&background=0284c7&color=fff&size=100'">
    <div class="branding-content">
      <div>Designed by <strong>"HassaanulHaq"</strong></div>
      <div>For more apps contact WhatsApp (text only):</div>
      <a href="https://wa.me/923324411598?text=Hello%20HassaanulHaq,%20I%20am%20contacting%20regarding%20your%20Voice%20Translator%20App" target="_blank" class="whatsapp-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#16a34a">
          <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.04 14.69 2 12.04 2M12.05 3.67C14.25 3.67 16.31 4.53 17.87 6.09C19.42 7.65 20.28 9.72 20.28 11.92C20.28 16.46 16.58 20.15 12.04 20.15C10.56 20.15 9.11 19.76 7.85 19L7.55 18.83L4.44 19.65L5.27 16.61L5.09 16.31C4.24 14.97 3.79 13.46 3.79 11.91C3.79 7.37 7.49 3.67 12.05 3.67Z"/>
        </svg>
        +92 (332) 4411598
      </a>
    </div>
  </div>

  <script>
    let recognition = null;
    let isListening = false;
    let currentAudio = null;
    let lastTranslations = null;

    const micBtn = document.getElementById('micBtn');
    const statusLabel = document.getElementById('statusLabel');
    const resultCard = document.getElementById('resultCard');
    const rowOriginal = document.getElementById('rowOriginal');
    const rowEnglish = document.getElementById('rowEnglish');
    const rowArabic = document.getElementById('rowArabic');

    function setupRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        statusLabel.innerText = "براؤزر میں مائیک کی سہولت موجود نہیں۔";
        return null;
      }
      const rec = new SpeechRecognition();
      rec.lang = 'ur-PK';
      rec.continuous = false;
      rec.interimResults = false;

      rec.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        statusLabel.innerText = "سن رہا ہے... بولئے";
        statusLabel.style.color = "#dc2626";
      };

      rec.onresult = (event) => {
        isListening = false;
        micBtn.classList.remove('listening');
        const text = event.results[0][0].transcript;
        statusLabel.innerText = "سنیں:";
        statusLabel.style.color = "#2563eb";
        displayOriginalText(text);
        startExecutionPipeline(text);
      };

      rec.onerror = () => {
        isListening = false;
        micBtn.classList.remove('listening');
        statusLabel.innerText = "دوبارہ مائیک دبائیں";
        statusLabel.style.color = "#1e293b";
      };

      rec.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
      };

      return rec;
    }

    recognition = setupRecognition();

    function handleMicToggle() {
      stopAllAudio();
      if (!recognition) {
        recognition = setupRecognition();
      }

      if (!isListening) {
        try {
          recognition.start();
        } catch(e) {
          recognition.abort();
          setTimeout(() => { try { recognition.start(); } catch(err){} }, 100);
        }
      } else {
        recognition.stop();
        isListening = false;
        micBtn.classList.remove('listening');
        statusLabel.innerText = "مائیک کا بٹن دبائیں اور بولیں";
        statusLabel.style.color = "#1e293b";
      }
    }

    function stopAllAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.src = "";
        currentAudio = null;
      }
      window.speechSynthesis.cancel();
    }

    function displayOriginalText(text) {
      resultCard.style.display = "block";
      rowOriginal.innerHTML = `<strong>آپ نے کہا:</strong> "${text}"`;
      rowEnglish.innerHTML = "";
      rowArabic.innerHTML = "";
    }

    async function startExecutionPipeline(spokenText) {
      const introText = "بارک اللہ ، چلیں دیکھتے ہیں اس جملے کو انگریزی اور عربی میں کیسے کہیں گے";
      
      speakControlledAudio(introText, "ur", 0.85, () => {
        fetchTranslations(spokenText).then(res => {
          lastTranslations = res;
          rowEnglish.innerHTML = `<span class="tag tag-en">English</span> ${res.english}`;
          rowArabic.innerHTML = `<span class="tag tag-ar">عربی</span> ${res.arabic}`;

          playSequence([
            { text: "اس جملے کو انگریزی میں اس طرح کہیں گے", lang: "ur", rate: 0.85 },
            { text: res.english, lang: "en", rate: 0.50 },
            { text: "اور اس جملے کو عربی میں اس طرح کہیں گے", lang: "ur", rate: 0.85 },
            { text: res.arabic, lang: "ar", rate: 0.50 }
          ]);
        });
      });
    }

    function repeatCurrentAudio() {
      if (!lastTranslations) return;
      stopAllAudio();
      statusLabel.innerText = "دوبارہ سنیں:";
      statusLabel.style.color = "#0284c7";

      playSequence([
        { text: "اس جملے کو انگریزی میں اس طرح کہیں گے", lang: "ur", rate: 0.85 },
        { text: lastTranslations.english, lang: "en", rate: 0.50 },
        { text: "اور اس جملے کو عربی میں اس طرح کہیں گے", lang: "ur", rate: 0.85 },
        { text: lastTranslations.arabic, lang: "ar", rate: 0.50 }
      ]);
    }

    async function fetchTranslations(urdu) {
      try {
        const [enRes, arRes] = await Promise.all([
          fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ur&tl=en&dt=t&q=${encodeURIComponent(urdu)}`),
          fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ur&tl=ar&dt=t&q=${encodeURIComponent(urdu)}`)
        ]);

        const enData = await enRes.json();
        const arData = await arRes.json();

        let en = enData[0][0][0];
        let ar = arData[0][0][0];

        const clean = urdu.trim();
        if (clean.includes("میرا نام") || clean.includes("میرا نا")) {
          const name = clean.replace(/میرا نام|میرا نا|ہے/g, "").trim();
          ar = `أَنَا ${name}`;
          en = `My name is ${name}`;
        }

        return { english: en, arabic: ar };
      } catch (e) {
        return { english: "Error in translation", arabic: "خطأ في الترجمة" };
      }
    }

    function speakControlledAudio(text, lang, targetRate, onFinish) {
      const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${lang}&client=tw-ob&q=${encodeURIComponent(text)}`;
      const audio = new Audio(audioUrl);
      currentAudio = audio;

      const enforceRate = () => {
        try {
          audio.playbackRate = targetRate;
        } catch(e) {}
      };

      audio.addEventListener('loadedmetadata', enforceRate);
      audio.addEventListener('play', enforceRate);
      audio.addEventListener('playing', enforceRate);

      let finished = false;
      const done = () => {
        if (!finished) {
          finished = true;
          setTimeout(() => {
            if (onFinish) onFinish();
          }, 700);
        }
      };

      audio.onended = done;
      audio.onerror = () => {
        const utt = new SpeechSynthesisUtterance(text);
        utt.lang = lang === "ur" ? "ur-PK" : lang === "ar" ? "ar-SA" : "en-US";
        utt.rate = targetRate;
        utt.onend = done;
        utt.onerror = done;
        window.speechSynthesis.speak(utt);
      };

      audio.play().then(enforceRate).catch(() => {
        done();
      });
    }

    function playSequence(playlist) {
      let idx = 0;
      function next() {
        if (idx < playlist.length) {
          const item = playlist[idx];
          idx++;
          speakControlledAudio(item.text, item.lang, item.rate, next);
        } else {
          statusLabel.innerText = "مائیک کا بٹن دبائیں اور بولیں";
          statusLabel.style.color = "#1e293b";
        }
      }
      next();
    }
  </script>
</body>
</html>
